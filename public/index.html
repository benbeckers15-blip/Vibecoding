<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SipLocal — Tasmanian Wine Guide</title>
  <meta name="description" content="SipLocal is an editorial guide to Tasmania's wineries and wine culture.">
  <style>
    body {
      margin: 0;
      background: #0F1411;
      color: #f0ece4;
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .kicker {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c9a85c;
      margin: 0 0 16px;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 600;
      font-size: 48px;
      line-height: 1.1;
      margin: 0 0 16px;
    }
    p { color: #b8b3a8; max-width: 420px; margin: 0 auto 24px; }
    a {
      color: #c9a85c;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div>
    <p class="kicker">SipLocal</p>
    <h1>The Tasmanian wine guide</h1>
    <p>
      An editorial guide to Tasmania's wineries, varietals, and cellar-door
      culture. Available on the iOS App Store.
    </p>
    <p>
      <a href="/privacy">Privacy policy</a>
    </p>
  </div>
</body>
</html>
